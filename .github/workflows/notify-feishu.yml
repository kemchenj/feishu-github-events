name: Notify Feishu

on:
  branch_protection_rule:
  check_run:
  check_suite:
  create:
  delete:
  deployment:
  deployment_status:
  discussion:
  discussion_comment:
  fork:
  gollum:
  image_version:
  issue_comment:
  issues:
  label:
  merge_group:
  milestone:
  page_build:
  public:
  pull_request:
  pull_request_review:
  pull_request_review_comment:
  pull_request_target:
  push:
  registry_package:
  release:
  repository_dispatch:
  schedule:
    - cron: "17 3 * * *"
  status:
  watch:
  workflow_call:
  workflow_dispatch:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

permissions:
  contents: read

jobs:
  notify:
    runs-on: ubuntu-latest
    env:
      FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
      FEISHU_SECRET: ${{ secrets.FEISHU_SECRET }}

    steps:
      - uses: actions/checkout@v4

      - name: Send Feishu notification
        if: ${{ env.FEISHU_WEBHOOK != '' }}
        uses: ./
        with:
          webhook: ${{ env.FEISHU_WEBHOOK }}
          secret: ${{ env.FEISHU_SECRET }}
